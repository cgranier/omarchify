# Which applications the keybindings launch.
#
# Copy nothing — edit in place, or override any of these in the environment
# before running install/40-gnome-settings.sh:
#
#   TERMINAL=ghostty BROWSER=chromium install/40-gnome-settings.sh
#
# Anything left unset is auto-detected from what's installed.

# TERMINAL=alacritty          # alacritty | ghostty | kitty | gnome-terminal | xdg-terminal-exec
# BROWSER=firefox             # firefox | chromium | google-chrome | brave-browser
# BROWSER_NEW_WINDOW="--new-window"
# BROWSER_PRIVATE="--private-window"   # chromium-family: --incognito
# EDITOR_CMD=nvim             # runs inside $TERMINAL
# FILE_MANAGER=nautilus
# ACTIVITY=btop               # runs inside $TERMINAL
# PASSWORD_MANAGER=1password  # bound to Super+Shift+/ ; unset to skip
